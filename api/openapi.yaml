  /orders/{id}/cancellation:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Allowed only while the order is `PLACED` and strictly less than 48 hours old (an order exactly 48:00:00
        old is rejected), for every payment method including COD. In one transaction the status becomes `CANCELLED`,
        physical stock is restored, redeemed points are restored and the payment becomes `REFUNDED` (simulated, no money
        moves) or, for COD, `CANCELLED`.
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                cancelled:
                  $ref: '#/components/examples/OrderCancelled'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The window has expired or the order is already cancelled; no state changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                windowExpired:
                  $ref: '#/components/examples/ErrCancellationWindow'
                alreadyCancelled:
                  $ref: '#/components/examples/ErrAlreadyCancelled'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/buy-again:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: buyAgain
      summary: Add an earlier order's books to the basket
      description: Adds each book of the order that is still in the catalogue and available, at its current price and
        delivery date. Out-of-stock or removed books are not added and are listed in the report; an over-stock quantity
        is reduced to the available quantity and reported.
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: The updated basket and the add report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketWithReport'
              examples:
                partial:
                  value:
                    basket:
                      items:
                        - book:
                            id: 7
                            title: The Habit Loop
                            author: Meera Iyer
                            description: A practical guide to building small daily routines.
                            format: PAPERBACK
                            publisher: Maple Leaf Press
                            language: English
                            price: '500.00'
                            frontCoverUrl: /covers/7-front.svg
                            categories:
                              - id: 13
                                name: Self Help
                            available: true
                            stockQuantity: 1
                            deliveryDate: '2026-11-17'
                          quantity: 1
                          lineTotal: '500.00'
                      itemCount: 1
                      subtotal: '500.00'
                      tax: '25.00'
                      deliveryCharge: '40.00'
                      total: '565.00'
                    report:
                      adjustments:
                        - bookId: 7
                          title: The Habit Loop
                          reason: QUANTITY_REDUCED
                          requestedQuantity: 2
                          addedQuantity: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: BG_AUTH
      description: HttpOnly JWT cookie set by `login` (SameSite=Strict, 60-minute lifetime, Secure by environment).
        The browser sends it automatically; the SPA never reads it. A missing, expired or logged-out token gives 401.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF token, copied from the readable `XSRF-TOKEN` cookie. Required together with `cookieAuth` on every
        POST, PUT and DELETE of a signed-in customer.
  parameters:
    AddressId:
      name: id
      in: path
      required: true
      description: Address id.
      schema:
        type: integer
        format: int64
        minimum: 1
    BookId:
      name: id
      in: path
      required: true
      description: Book id.
      schema:
        type: integer
        format: int64
        minimum: 1
    BasketBookId:
      name: bookId
      in: path
      required: true
      description: Id of the book whose basket line is addressed.
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      description: Order id.
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: Zero-based page number. The page size is fixed at 12 and cannot be changed.
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per checkout attempt, reused when the same attempt is retried.
      schema:
        type: string
        format: uuid
  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
    SetCookie:
      description: Authentication cookies. `BG_AUTH` is HttpOnly and SameSite=Strict; `XSRF-TOKEN` is readable by the SPA.
        On logout both cookies are expired.
      schema:
        type: string
  responses:
    ValidationFailed:
      description: The request is invalid. `fieldErrors` lists each invalid field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validationFailed:
              $ref: '#/components/examples/ErrValidation'
    Unauthenticated:
      description: No valid `BG_AUTH` cookie (missing, expired or invalidated by logout), or the `X-XSRF-TOKEN` header is
        missing or wrong on a state-changing call.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unauthenticated:
              $ref: '#/components/examples/ErrUnauthenticated'
    NotFound:
      description: The resource does not exist or belongs to another customer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            notFound:
              $ref: '#/components/examples/ErrNotFound'
    BasketQuantityConflict:
      description: The quantity would exceed 10 units of the book or the available physical stock.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            quantityLimit:
              $ref: '#/components/examples/ErrQuantityLimit'
            outOfStock:
              $ref: '#/components/examples/ErrOutOfStock'
    InternalError:
      description: Unexpected server error. The body is generic and never contains internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            internalError:
              $ref: '#/components/examples/ErrInternal'
  schemas:
    Money:
      type: string
      description: Decimal amount in rupees with exactly two decimals.
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '1090.00'
    ApiError:
      type: object
      description: The single error shape used by every 4xx and 5xx response.
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 400
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - EMAIL_TAKEN
            - NOT_FOUND
            - BOOK_NOT_FOUND
            - QUANTITY_LIMIT
            - OUT_OF_STOCK
            - EMPTY_BASKET
            - BASKET_CHANGED
            - POINTS_LIMIT_EXCEEDED
            - PAYMENT_DECLINED
            - CANCELLATION_WINDOW_EXPIRED
            - ALREADY_CANCELLED
            - ALREADY_REVIEWED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable, generic message safe to show to the customer.
        fieldErrors:
          type: array
          description: Present for `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
        timestamp:
          type: string
          format: date-time
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Enter a valid e-mail address.
    Customer:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
    RegisterRequest:
      type: object
      required: [fullName, email, password, confirmPassword]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: Required, not blank.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,64}$'
          description: 8 to 64 characters with at least one letter and one digit.
        confirmPassword:
          type: string
          format: password
          description: Must equal `password`.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 64
    AddressInput:
      type: object
      required: [fullName, phone, addressLine1, city, state, pinCode, country]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        phone:
          type: string
          pattern: '^[0-9]{10}$'
          description: Exactly 10 digits.
        addressLine1:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
        addressLine2:
          type: string
          maxLength: 150
          description: Optional.
        city:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '\S'
        state:
          type: string
          minLength: 1
          maxLength: 60
