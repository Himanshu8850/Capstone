openapi: 3.0.3
info:
  title: BookyGeek API
  version: 1.3.0
  description: |
    Contract for the BookyGeek online bookstore (single Spring Boot modular monolith, PostgreSQL).
    This file is the hand-written source of truth (gate G-API); backend code is written to match it.

    **Conventions**
    - Base path `/api/v1`, JSON only (`application/json`), camelCase fields, ISO-8601 dates and instants.
    - Money is a **decimal string with two decimals** (for example `"1090.00"`), never a JSON number.
    - Identifiers are integers. Enumerations are upper-case strings.
    - Catalogue results are paged with a fixed page size of **12** (the page size is not a client parameter).
    - Every 4xx/5xx response body is one `ApiError`.
    - Status codes: 200 read/update/action, 201 create, 204 delete/logout, 400 invalid input,
      401 not authenticated, 404 unknown or not-owned resource, 409 business conflict, 500 generic.
      403 is not used (single role); another customer's data is answered as 404.
    - Authentication is the HttpOnly `BG_AUTH` cookie. Every state-changing call of a signed-in customer
      (POST, PUT, DELETE on a protected operation) must also send the `X-XSRF-TOKEN` header, copied from the
      `XSRF-TOKEN` cookie that the server sets on responses. Such a call without a matching token is rejected
      and changes nothing. Public operations (`security: []`) need neither the cookie nor the token.
    - Responses never contain password hashes, token versions or card data. Card details are accepted only in the
      `placeOrder` request body and are never echoed, stored or logged.
    - Card and UPI values in the examples are the documented dummy test values (PL-06). Card `4111-1111-1111-1111`
      and UPI `demo@upi` succeed; card `4000-0000-0000-0002` and UPI `failure@upi` are declined.
servers:
  - url: /api/v1
    description: Same-origin base path (the frontend proxy forwards /api to the backend).
tags:
  - name: Authentication
    description: Registration, login, logout and the current customer.
  - name: Addresses
    description: Saved delivery addresses of the signed-in customer.
  - name: Reference
    description: Static reference data.
  - name: Catalogue
    description: Categories, brands and books (public).
  - name: Basket
    description: Guest basket preview and the signed-in customer's basket.
  - name: Checkout
    description: Reward balance and checkout quote.
  - name: Orders
    description: Order placement (with simulated payment), history, cancellation and Buy Again.
security: []
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a customer account
      description: Creates an account. The e-mail is the unique login identifier and is compared case-insensitively.
        Registration does not sign the customer in. A new account starts with the seeded reward balance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              valid:
                summary: Valid registration
                value:
                  fullName: Asha Verma
                  email: asha.verma@example.com
                  password: <your-password>
                  confirmPassword: <your-password>
      responses:
        '201':
          description: Account created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                created:
                  value:
                    id: 1
                    fullName: Asha Verma
                    email: asha.verma@example.com
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: The e-mail address is already registered (compared case-insensitively).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                emailTaken:
                  $ref: '#/components/examples/ErrEmailTaken'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: Validates the e-mail (case-insensitive) and password. On success the server sets the HttpOnly
        `BG_AUTH` cookie (SameSite=Strict, 60-minute lifetime) and the readable `XSRF-TOKEN` cookie. A wrong e-mail and
        a wrong password return the same generic error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid:
                summary: Valid credentials
                value:
                  email: asha.verma@example.com
                  password: <your-password>
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                signedIn:
                  value:
                    id: 1
                    fullName: Asha Verma
                    email: asha.verma@example.com
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Generic failure; does not reveal whether the e-mail or the password was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidCredentials:
                  $ref: '#/components/examples/ErrInvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out
      description: Expires the `BG_AUTH` cookie and invalidates the token that was in use, so a replayed cookie is
        rejected afterwards.
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '204':
          description: Signed out; the cookie is expired.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentCustomer
      summary: Get the signed-in customer
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The signed-in customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                customer:
                  value:
                    id: 1
                    fullName: Asha Verma
                    email: asha.verma@example.com
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /addresses:
    get:
      tags: [Addresses]
      operationId: listAddresses
      summary: List the customer's saved addresses
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Saved addresses (empty array when none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
              examples:
                twoAddresses:
                  value:
                    - id: 1
                      fullName: Asha Verma
                      phone: '9876543210'
                      addressLine1: 12 Lake View Road
                      addressLine2: Near City Park
                      city: Bengaluru
                      state: Karnataka
                      pinCode: '560001'
                      country: India
                    - id: 2
                      fullName: Asha Verma
                      phone: '9876543210'
                      addressLine1: 5 Marine Drive
                      city: Mumbai
                      state: Maharashtra
                      pinCode: '400020'
                      country: India
                none:
                  summary: No saved addresses
                  value: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: Save a new address
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
            examples:
              valid:
                summary: Valid address
                value:
                  fullName: Asha Verma
                  phone: '9876543210'
                  addressLine1: 12 Lake View Road
                  addressLine2: Near City Park
                  city: Bengaluru
                  state: Karnataka
                  pinCode: '560001'
                  country: India
      responses:
        '201':
          description: Address saved.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                created:
                  value:
                    id: 1
                    fullName: Asha Verma
                    phone: '9876543210'
                    addressLine1: 12 Lake View Road
                    addressLine2: Near City Park
                    city: Bengaluru
                    state: Karnataka
                    pinCode: '560001'
                    country: India
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: Replace a saved address
      description: Full replacement of one of the signed-in customer's addresses. An address that does not exist or
        belongs to another customer is answered as 404.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
            examples:
              valid:
                summary: Corrected PIN code
                value:
                  fullName: Asha Verma
                  phone: '9876543210'
                  addressLine1: 12 Lake View Road
                  city: Bengaluru
                  state: Karnataka
                  pinCode: '560002'
                  country: India
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                updated:
                  value:
                    id: 1
                    fullName: Asha Verma
                    phone: '9876543210'
                    addressLine1: 12 Lake View Road
                    city: Bengaluru
                    state: Karnataka
                    pinCode: '560002'
                    country: India
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: Delete a saved address
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '204':
          description: Address deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /reference/states:
    get:
      tags: [Reference]
      operationId: listStates
      summary: List the Indian states and union territories
      description: The 28 states and 8 union territories used for address entry. When the address country is India
        the state must be one of these values.
      responses:
        '200':
          description: State names in alphabetical order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                states:
                  summary: Excerpt of the 36 values
                  value: [Andaman and Nicobar Islands, Andhra Pradesh, Karnataka, Maharashtra, West Bengal]
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      summary: List the category tree
      description: Two-level tree (Fiction and Non-Fiction with their leaf categories). Books belong to leaf categories;
        a parent category lists the books of itself and its children. The "All" entry is a UI element, not data.
      responses:
        '200':
          description: Top-level categories with their children.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              examples:
                tree:
                  value:
                    - id: 1
                      name: Fiction
                      children:
                        - id: 3
                          name: Romance
                          children: []
                        - id: 4
                          name: Mystery
                          children: []
                    - id: 2
                      name: Non-Fiction
                      children:
                        - id: 13
                          name: Self Help
                          children: []
        '500':
          $ref: '#/components/responses/InternalError'
  /brands:
    get:
      tags: [Catalogue]
      operationId: listBrands
      summary: List brands (publishers)
      description: A brand is the book's publisher. Only publishers that have at least one listed book appear.
      responses:
        '200':
          description: Brands in alphabetical order with their book counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
              examples:
                brands:
                  value:
                    - name: Maple Leaf Press
                      bookCount: 8
                    - name: Northwind Books
                      bookCount: 6
        '500':
          $ref: '#/components/responses/InternalError'
  /books:
    get:
      tags: [Catalogue]
      operationId: listBooks
      summary: List books
      description: Filters, sorting and paging combine. `category` selects the whole subtree of that category.
        Genre tags are categories, so a genre tag uses `category`. Page size is fixed at 12.
      parameters:
        - name: category
          in: query
          description: Category id; a parent category includes its children.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: brand
          in: query
          description: Exact publisher name.
          schema:
            type: string
            maxLength: 120
        - name: q
          in: query
          description: Search text matched against title and author.
          schema:
            type: string
            maxLength: 100
        - name: author
          in: query
          description: Exact author name.
          schema:
            type: string
            maxLength: 120
        - name: language
          in: query
          schema:
            type: string
            maxLength: 40
        - name: format
          in: query
          schema:
            $ref: '#/components/schemas/BookFormat'
        - name: minPrice
          in: query
          description: Lower price bound, inclusive (decimal string).
          schema:
            $ref: '#/components/schemas/Money'
        - name: maxPrice
          in: query
          description: Upper price bound, inclusive (decimal string).
          schema:
            $ref: '#/components/schemas/Money'
        - name: sort
          in: query
          schema:
            type: string
            enum: [RELEVANCE, PRICE_ASC, PRICE_DESC, TITLE_ASC]
            default: RELEVANCE
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: One page of books (at most 12).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
              examples:
                firstPage:
                  summary: First page of a two-page result
                  value:
                    items:
                      - id: 7
                        title: The Habit Loop
                        author: Meera Iyer
                        description: A practical guide to building small daily routines.
                        format: PAPERBACK
                        publisher: Maple Leaf Press
                        language: English
                        price: '500.00'
                        frontCoverUrl: /covers/7-front.svg
                        categories:
                          - id: 13
                            name: Self Help
                        available: true
                        stockQuantity: 25
                        deliveryDate: '2026-11-17'
                      - id: 12
                        title: Quiet Mornings
                        author: Meera Iyer
                        description: Essays on slowing down.
                        format: EBOOK
                        publisher: Northwind Books
                        language: English
                        price: '299.00'
                        frontCoverUrl: /covers/12-front.svg
                        categories:
                          - id: 13
                            name: Self Help
                        available: true
                        stockQuantity: null
                        deliveryDate: '2026-11-12'
                    page: 0
                    pageSize: 12
                    totalItems: 14
                    totalPages: 2
                empty:
                  summary: No match
                  value:
                    items: []
                    page: 0
                    pageSize: 12
                    totalItems: 0
                    totalPages: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /books/filter-options:
    get:
      tags: [Catalogue]
      operationId: getBookFilterOptions
      summary: Get the filter option lists
      description: Languages present in the listed books, the three formats and the price-band presets. A band is a
        labelled preset of `minPrice`/`maxPrice`.
      responses:
        '200':
          description: Filter option lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
              examples:
                options:
                  value:
                    languages: [English, French, Hindi, Spanish]
                    formats: [PAPERBACK, HARDCOVER, EBOOK]
                    priceBands:
                      - label: Under ₹200
                        minPrice: null
                        maxPrice: '199.99'
                      - label: ₹200–₹499
                        minPrice: '200.00'
                        maxPrice: '499.99'
                      - label: ₹500–₹999
                        minPrice: '500.00'
                        maxPrice: '999.99'
                      - label: ₹1,000 and above
                        minPrice: '1000.00'
                        maxPrice: null
        '500':
          $ref: '#/components/responses/InternalError'
  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Catalogue]
      operationId: getBook
      summary: Get one book
      responses:
        '200':
          description: The book with its breadcrumb and back cover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
              examples:
                book:
                  value:
                    id: 7
                    title: The Habit Loop
                    author: Meera Iyer
                    description: A practical guide to building small daily routines.
                    format: PAPERBACK
                    publisher: Maple Leaf Press
                    language: English
                    price: '500.00'
                    frontCoverUrl: /covers/7-front.svg
                    backCoverUrl: /covers/7-back.svg
                    categories:
                      - id: 13
                        name: Self Help
                    available: true
                    stockQuantity: 25
                    deliveryDate: '2026-11-17'
                    breadcrumb:
                      - id: 2
                        name: Non-Fiction
                      - id: 13
                        name: Self Help
        '404':
          description: No such book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                bookNotFound:
                  $ref: '#/components/examples/ErrBookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /books/{id}/related:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Catalogue]
      operationId: listRelatedBooks
      summary: List related books
      description: Other books that share a category with this book; never the book itself. Empty when there are none.
      responses:
        '200':
          description: Related books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
              examples:
                related:
                  value:
                    - id: 12
                      title: Quiet Mornings
                      author: Meera Iyer
                      description: Essays on slowing down.
                      format: EBOOK
                      publisher: Northwind Books
                      language: English
                      price: '299.00'
                      frontCoverUrl: /covers/12-front.svg
                      categories:
                        - id: 13
                          name: Self Help
                      available: true
                      stockQuantity: null
                      deliveryDate: '2026-11-12'
                none:
                  summary: No related books
                  value: []
        '404':
          description: No such book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                bookNotFound:
                  $ref: '#/components/examples/ErrBookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /books/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Catalogue]
      operationId: listBookReviews
      summary: List the reviews of a book
      description: Public. Newest first. `averageRating` is rounded HALF_UP to one decimal and is null when the book has
        no reviews. A review comment may be null.
      security: []
      responses:
        '200':
          description: The average rating, the number of reviews and the reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
              examples:
                reviews:
                  value:
                    averageRating: 4.5
                    reviewCount: 2
                    reviews:
                      - id: 1
                        reviewerName: Asha Verma
                        rating: 5
                        comment: Great read
                        createdAt: '2026-11-18T06:30:00Z'
                      - id: 2
                        reviewerName: Ravi Nair
                        rating: 4
                        comment: null
                        createdAt: '2026-11-17T09:00:00Z'
        '404':
          description: No such book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                bookNotFound:
                  $ref: '#/components/examples/ErrBookNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalogue]
      operationId: createBookReview
      summary: Review a book
      description: One review per customer per book. A review cannot be edited or deleted.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
            examples:
              valid:
                summary: Valid review
                value:
                  rating: 5
                  comment: Great read
      responses:
        '201':
          description: Review saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              examples:
                created:
                  value:
                    id: 1
                    reviewerName: Asha Verma
                    rating: 5
                    comment: Great read
                    createdAt: '2026-11-18T06:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                bookNotFound:
                  $ref: '#/components/examples/ErrBookNotFound'
        '409':
          description: The customer has already reviewed this book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                alreadyReviewed:
                  $ref: '#/components/examples/ErrAlreadyReviewed'
        '500':
          $ref: '#/components/responses/InternalError'
  /basket/preview:
    post:
      tags: [Basket]
      operationId: previewBasket
      summary: Price a guest basket
      description: Public. Prices the lines sent by a guest (kept in the browser) with the current prices, delivery
        dates and totals. Nothing is stored. Unavailable books are priced but flagged as not available.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketLinesRequest'
            examples:
              guest:
                value:
                  items:
                    - bookId: 7
                      quantity: 2
      responses:
        '200':
          description: Priced basket (not persisted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
              examples:
                priced:
                  $ref: '#/components/examples/BasketPhysical'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /basket:
    get:
      tags: [Basket]
      operationId: getBasket
      summary: Get the customer's basket
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The basket with prices, delivery dates and totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
              examples:
                withItems:
                  $ref: '#/components/examples/BasketPhysical'
                empty:
                  $ref: '#/components/examples/BasketEmpty'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /basket/items:
    post:
      tags: [Basket]
      operationId: addBasketItem
      summary: Add a book to the basket
      description: Adding a book that is already present increases its quantity. A line may hold at most 10 units and,
        for a physical book, never more than the available stock. Adding does not reserve stock.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBasketItemRequest'
            examples:
              one:
                value:
                  bookId: 7
                  quantity: 1
      responses:
        '200':
          description: The updated basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
              examples:
                updated:
                  $ref: '#/components/examples/BasketPhysical'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                bookNotFound:
                  $ref: '#/components/examples/ErrBookNotFound'
        '409':
          $ref: '#/components/responses/BasketQuantityConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /basket/items/{bookId}:
    parameters:
