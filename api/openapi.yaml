  /checkout/quote:
    post:
      tags: [Checkout]
      operationId: quoteCheckout
      summary: Quote the checkout totals
      description: Revalidates the basket (stock and price) and applies the requested reward points. The maximum
        redeemable points are `min(availableRewardBalance, floor(0.50 × (subtotal + tax + deliveryCharge)))`.
        Tax (5% of the discounted subtotal, once per order, HALF_UP to two decimals) and the delivery charge (₹40.00
        for physical-only and mixed orders, ₹0.00 for eBook-only orders) are described on `CheckoutQuote`.
        Nothing is stored.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutQuoteRequest'
            examples:
              hundredPoints:
                value:
                  pointsToRedeem: 100
      responses:
        '200':
          description: The quote. `issues` lists basket changes that must be resolved or acknowledged before payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutQuote'
              examples:
                quote:
                  value:
                    subtotal: '1000.00'
                    tax: '50.00'
                    deliveryCharge: '40.00'
                    total: '1090.00'
                    balance: 1000
                    maxRedeemablePoints: 545
                    pointsToRedeem: 100
                    payableTotal: '990.00'
                    issues: []
                withIssue:
                  summary: A price changed since the book was added
                  value:
                    subtotal: '1100.00'
                    tax: '55.00'
                    deliveryCharge: '40.00'
                    total: '1195.00'
                    balance: 1000
                    maxRedeemablePoints: 597
                    pointsToRedeem: 0
                    payableTotal: '1195.00'
                    issues:
                      - bookId: 7
                        title: The Habit Loop
                        type: PRICE_CHANGED
                        message: The price of this book changed from 500.00 to 550.00.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The basket is empty, or the requested points exceed the balance or the 50% cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                pointsLimit:
                  $ref: '#/components/examples/ErrPointsLimit'
                emptyBasket:
                  $ref: '#/components/examples/ErrEmptyBasket'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List the customer's orders
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The customer's orders, newest first (empty array when none).
          content:
