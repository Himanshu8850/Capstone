    CheckoutIssue:
      type: object
      required: [bookId, title, type, message]
      properties:
        bookId:
          type: integer
          format: int64
        title:
          type: string
        type:
          type: string
          enum: [OUT_OF_STOCK, QUANTITY_REDUCED, PRICE_CHANGED, NOT_IN_CATALOGUE]
        message:
          type: string
    CheckoutQuote:
      type: object
      required: [subtotal, tax, deliveryCharge, total, balance, maxRedeemablePoints, pointsToRedeem, payableTotal, issues]
      description: |
        Approved pricing and reward rules (amounts are `Money` strings in rupees with two decimals):

        - **Tax**: 5% of the discounted subtotal (subtotal minus any discount; no discount exists because coupons are
          excluded, so the discounted subtotal equals `subtotal`). Tax is calculated once per order, not per line,
          and rounded to two decimal places using HALF_UP.
        - **Delivery charge**: physical-only order ₹40.00 per order; eBook-only order ₹0.00; mixed physical and eBook
          order ₹40.00 per order.
        - **Total**: `subtotal + tax + deliveryCharge`.
        - **Maximum redeemable points**: `min(availableRewardBalance, floor(0.50 × (subtotal + tax + deliveryCharge)))`.
          The 50% cap is applied to the total payable amount before reward redemption (subtotal, tax and delivery
          charge) and is rounded down to a whole point.
        - **Payable total**: `total − pointsToRedeem` (one point is worth ₹1).
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 5% of the discounted subtotal, calculated once per order and rounded HALF_UP to two decimals.
        deliveryCharge:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '"40.00" for a physical-only or mixed order, "0.00" for an eBook-only order (per order).'
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: subtotal + tax + deliveryCharge, before reward redemption.
        balance:
          type: integer
          minimum: 0
          description: Available reward balance in points.
        maxRedeemablePoints:
          type: integer
          minimum: 0
          description: min(availableRewardBalance, floor(0.50 × (subtotal + tax + deliveryCharge))).
        pointsToRedeem:
          type: integer
          minimum: 0
        payableTotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: total − pointsToRedeem.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutIssue'
    CardDetails:
      type: object
      required: [number, nameOnCard, cvv, expiry]
      properties:
        number:
          type: string
          writeOnly: true
          pattern: '^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}$'
          description: Format XXXX-XXXX-XXXX-XXXX.
        nameOnCard:
          type: string
          writeOnly: true
          minLength: 2
          maxLength: 60
        cvv:
          type: string
          writeOnly: true
          pattern: '^[0-9]{3}$'
          description: Exactly 3 digits.
        expiry:
          type: string
          writeOnly: true
          pattern: '^(0[1-9]|1[0-2])/[0-9]{4}$'
          description: MM/YYYY, not in the past.
    UpiDetails:
      type: object
      required: [upiId]
      properties:
        upiId:
          type: string
          pattern: '^[A-Za-z0-9._-]{2,64}@[A-Za-z][A-Za-z0-9]{1,31}$'
          description: Simulated UPI ID in the form name@handle.
    PaymentDetails:
      type: object
      description: Supply `card` for CREDIT_CARD and DEBIT_CARD, `upi` for UPI, and omit the object for COD.
        Exactly one of `card` or `upi` is present; both together, or neither, is invalid. The match with
        `paymentMethod` is enforced on `PlaceOrderRequest`.
      properties:
        card:
          $ref: '#/components/schemas/CardDetails'
        upi:
          $ref: '#/components/schemas/UpiDetails'
      oneOf:
        - required: [card]
        - required: [upi]
    PaymentMethod:
      type: string
      enum: [CREDIT_CARD, DEBIT_CARD, UPI, COD]
    PaymentStatus:
      type: string
      description: PAID for card and UPI; PENDING_ON_DELIVERY for COD; REFUNDED (simulated) or CANCELLED after cancellation.
      enum: [PAID, PENDING_ON_DELIVERY, REFUNDED, CANCELLED]
    PlaceOrderRequest:
      type: object
      required: [paymentMethod, pointsToRedeem, expectedPayableTotal]
      description: |
        Send exactly one of `addressId` (a saved address) or `address` (entered at checkout). When the basket holds
        only e-books nothing is delivered, so send neither (AMD-004); sending one is accepted and ignored.

        The `payment` object must match `paymentMethod`:
        - `CREDIT_CARD` and `DEBIT_CARD`: `payment` is required and contains `card` (and not `upi`).
        - `UPI`: `payment` is required and contains `upi` (and not `card`).
        - `COD`: `payment` must be omitted (neither `card` nor `upi` is accepted).

        `pointsToRedeem` may not exceed `maxRedeemablePoints` of the checkout quote, that is
        `min(availableRewardBalance, floor(0.50 × (subtotal + tax + deliveryCharge)))`.
        `expectedPayableTotal` is the quoted `payableTotal` = `subtotal + tax + deliveryCharge − pointsToRedeem`
        (one point = ₹1); the order is rejected if the recalculated amount differs. Tax and delivery are
        calculated as documented on `CheckoutQuote`.
      properties:
        addressId:
          type: integer
          format: int64
          minimum: 1
        address:
          $ref: '#/components/schemas/AddressInput'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        payment:
          $ref: '#/components/schemas/PaymentDetails'
        pointsToRedeem:
          type: integer
          minimum: 0
        expectedPayableTotal:
          $ref: '#/components/schemas/Money'
      allOf:
        - not:
            required: [addressId, address]
        - oneOf:
            - description: Card payment (credit or debit) requires `payment.card` and rejects `payment.upi`.
              required: [paymentMethod, payment]
              properties:
                paymentMethod:
                  type: string
                  enum: [CREDIT_CARD, DEBIT_CARD]
                payment:
                  type: object
                  required: [card]
                  properties:
                    card:
                      $ref: '#/components/schemas/CardDetails'
                    upi:
                      $ref: '#/components/schemas/UpiDetails'
                  not:
                    required: [upi]
                    properties:
                      upi:
                        $ref: '#/components/schemas/UpiDetails'
            - description: UPI payment requires `payment.upi` and rejects `payment.card`.
              required: [paymentMethod, payment]
              properties:
                paymentMethod:
                  type: string
                  enum: [UPI]
                payment:
                  type: object
                  required: [upi]
                  properties:
                    card:
                      $ref: '#/components/schemas/CardDetails'
                    upi:
                      $ref: '#/components/schemas/UpiDetails'
                  not:
                    required: [card]
                    properties:
                      card:
                        $ref: '#/components/schemas/CardDetails'
            - description: Cash on delivery accepts no payment details (`payment` is omitted).
              required: [paymentMethod]
              properties:
                paymentMethod:
                  type: string
                  enum: [COD]
                payment:
                  $ref: '#/components/schemas/PaymentDetails'
              not:
                required: [payment]
                properties:
                  payment:
                    $ref: '#/components/schemas/PaymentDetails'
    OrderItem:
