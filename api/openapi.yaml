              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
              examples:
                orders:
                  value:
                    - id: 2
                      reference: BG-000002
                      status: PLACED
                      placedAt: '2026-11-12T10:15:30Z'
                      items:
                        - book:
                            id: 7
                            title: The Habit Loop
                            author: Meera Iyer
                            description: A practical guide to building small daily routines.
                            format: PAPERBACK
                            publisher: Maple Leaf Press
                            language: English
                            price: '500.00'
                            frontCoverUrl: /covers/7-front.svg
                            categories:
                              - id: 13
                                name: Self Help
                            available: true
                            stockQuantity: 23
                            deliveryDate: '2026-11-17'
                          quantity: 2
                          unitPrice: '500.00'
                          lineTotal: '1000.00'
                      payableTotal: '990.00'
                none:
                  summary: No orders yet
                  value: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order (with simulated payment)
      description: |
        Payment is a step of order placement: there is no separate pay operation. In one transaction the server
        revalidates the basket, stock, `expectedPayableTotal` and the points cap, runs the **simulated** payment,
        creates the order, decreases physical stock, deducts the redeemed points and clears the basket.
        If any step fails nothing changes, except that a declined payment attempt is recorded as `FAILED`.

        - Credit card / debit card: `payment.card` is required. `4111-1111-1111-1111` succeeds and
          `4000-0000-0000-0002` is declined. Payment status of the order is `PAID`.
        - UPI: `payment.upi` is required. `demo@upi` succeeds and `failure@upi` is declined. Status `PAID`.
        - COD: no payment details; the order is placed with payment status `PENDING_ON_DELIVERY`.
        - Card details exist only in this request; they are never echoed, stored or logged.

        The `Idempotency-Key` header makes retries safe: repeating a request with the same key and customer returns
        the stored result (200, same body) and never creates a second order.
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
            examples:
              cardSuccess:
                summary: Credit card, saved address, 100 points (approved)
                value:
                  addressId: 1
                  paymentMethod: CREDIT_CARD
                  payment:
                    card:
                      number: 4111-1111-1111-1111
                      nameOnCard: Asha Verma
                      cvv: '123'
                      expiry: 12/2030
                  pointsToRedeem: 100
                  expectedPayableTotal: '990.00'
              cardDeclined:
                summary: Debit card declined by the simulated gateway
                value:
                  addressId: 1
                  paymentMethod: DEBIT_CARD
                  payment:
                    card:
                      number: 4000-0000-0000-0002
                      nameOnCard: Asha Verma
                      cvv: '123'
                      expiry: 12/2030
                  pointsToRedeem: 0
                  expectedPayableTotal: '1090.00'
              upiSuccess:
                summary: UPI approved
                value:
                  addressId: 1
                  paymentMethod: UPI
                  payment:
                    upi:
                      upiId: demo@upi
                  pointsToRedeem: 0
                  expectedPayableTotal: '1090.00'
              upiDeclined:
                summary: UPI declined
                value:
                  addressId: 1
                  paymentMethod: UPI
                  payment:
                    upi:
                      upiId: failure@upi
                  pointsToRedeem: 0
                  expectedPayableTotal: '1090.00'
              cashOnDelivery:
                summary: Cash on delivery with a new address
                value:
                  address:
                    fullName: Asha Verma
                    phone: '9876543210'
                    addressLine1: 12 Lake View Road
                    city: Bengaluru
                    state: Karnataka
                    pinCode: '560001'
                    country: India
                  paymentMethod: COD
                  pointsToRedeem: 0
                  expectedPayableTotal: '1090.00'
      responses:
        '200':
          description: Replay of an earlier request with the same `Idempotency-Key`; the stored order is returned and no
            new order is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                replay:
                  $ref: '#/components/examples/OrderPlacedPaid'
        '201':
          description: Order placed.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                paid:
                  $ref: '#/components/examples/OrderPlacedPaid'
                cod:
                  $ref: '#/components/examples/OrderPlacedCod'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Business conflict; nothing was ordered. `PAYMENT_DECLINED` leaves the basket, stock and points
            unchanged so the customer can retry or choose another method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                paymentDeclined:
                  $ref: '#/components/examples/ErrPaymentDeclined'
                basketChanged:
                  $ref: '#/components/examples/ErrBasketChanged'
                outOfStock:
                  $ref: '#/components/examples/ErrOutOfStock'
                pointsLimit:
                  $ref: '#/components/examples/ErrPointsLimit'
                emptyBasket:
                  $ref: '#/components/examples/ErrEmptyBasket'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}:
