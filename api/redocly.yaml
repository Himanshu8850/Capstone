# Lint configuration for api/openapi.yaml (developer tool only; not part of the product runtime).
# Run: npx @redocly/cli@2.78.0 lint api/openapi.yaml --config api/redocly.yaml
extends:
  - recommended
rules:
  # listStates, listCategories, listBrands and getBookFilterOptions take no input and have no client-error case in the
  # approved outline (contracts/api-contract-outline.md §2); a 4xx response would be invented behaviour.
  operation-4xx-response: off
  # No licence has been chosen for the capstone project; none is declared.
  info-license: off
